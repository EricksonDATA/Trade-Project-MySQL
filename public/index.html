<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrade - Dashboard</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent: #0f172a;
            --green: #059669;
            --green-bg: #ecfdf5;
            --green-border: #a7f3d0;
            --red: #dc2626;
            --red-bg: #fef2f2;
            --red-border: #fecaca;
            --blue: #2563eb;
            --blue-bg: #eff6ff;
            --blue-border: #bfdbfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            padding: 32px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1040px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 28px;
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .brand p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-switcher {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-switcher label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .user-switcher select {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .user-switcher select:focus {
            border-color: var(--accent);
        }

        /* Alert / Banner */
        #alert-box {
            display: none;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .alert-success {
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid var(--green-border);
        }

        .alert-error {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red-border);
        }

        /* Cards Grid */
        .grid-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }

        @media (max-width: 768px) {
            .grid-top {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .card-header {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .user-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Forms */
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 11px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1e293b;
        }

        .btn-outline {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: var(--border-light);
        }

        .btn-deposit {
            background: var(--accent);
            color: #ffffff;
            white-space: nowrap;
        }

        .btn-deposit:hover {
            background: #1e293b;
        }

        .btn-buy {
            background: var(--accent);
            color: #ffffff;
            flex: 1;
        }

        .btn-buy:hover {
            background: #1e293b;
        }

        .btn-sell {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            flex: 1;
        }

        .btn-sell:hover {
            background: var(--border-light);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
        }

        .refresh-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        /* Tables */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 32px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            margin-bottom: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            background: #fafafa;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-deposit {
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid var(--green-border);
        }

        .badge-buy {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red-border);
        }

        .badge-sell {
            background: var(--blue-bg);
            color: var(--blue);
            border: 1px solid var(--blue-border);
        }

        .amount-positive {
            color: var(--green);
            font-weight: 600;
        }

        .amount-negative {
            color: var(--red);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <h1>ApexTrade</h1>
                <p>MySQL 8.0 Transactional Engine</p>
            </div>
            <div class="user-switcher">
                <label for="user-select">User</label>
                <select id="user-select" onchange="loadUserData()">
                    <option value="1">Alice (alice@apex.com)</option>
                    <option value="2">Bob (bob@apex.com)</option>
                    <option value="3">Charlie (charlie@apex.com)</option>
                </select>
            </div>
        </header>

        <!-- Status Banner -->
        <div id="alert-box"></div>

        <!-- Cards: Balance & Trading -->
        <div class="grid-top">
            <!-- Balance Card -->
            <div class="card">
                <div class="card-header">
                    <span>Cash Balance (wallets)</span>
                    <button class="refresh-btn" onclick="loadUserData()">Refresh</button>
                </div>
                <div class="balance-amount" id="wallet-balance">$0.00</div>
                <div class="user-meta" id="user-info">Loading...</div>

                <div style="margin-top: 22px; border-top: 1px solid var(--border-light); padding-top: 16px;">
                    <div class="card-header" style="margin-bottom: 8px;">Quick Deposit</div>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="deposit-amount" placeholder="Amount ($)" min="1" step="10" style="flex: 1;">
                        <button class="btn btn-deposit" onclick="handleDeposit()">Deposit</button>
                    </div>
                </div>
            </div>

            <!-- Trading Card -->
            <div class="card">
                <div class="card-header">
                    <span>Trade Assets</span>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label>Asset</label>
                    <select id="asset-select" onchange="updateDefaultPrice()">
                        <!-- Dynamic -->
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="trade-qty" placeholder="1.0" min="0.0001" step="any" value="1">
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" id="trade-price" placeholder="150.00" min="0.01" step="0.01">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label>Estimated Total</label>
                    <div id="trade-total" style="font-size: 16px; font-weight: 600; color: var(--text-primary);">$0.00</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-buy" onclick="handleTrade('buy')">Buy</button>
                    <button class="btn btn-sell" onclick="handleTrade('sell')">Sell</button>
                </div>
            </div>
        </div>

        <!-- Portfolio Holdings -->
        <div class="section-header">
            <span class="section-title">Portfolio Holdings</span>
            <span class="section-subtitle">portfolios</span>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Ticker</th>
                        <th>Name</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="holdings-body">
                    <tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 18px;">No holdings.</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Audit Ledger -->
        <div class="section-header">
            <span class="section-title">Audit Ledger</span>
            <span class="section-subtitle">transaction_ledger (append-only)</span>
        </div>
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Asset</th>
                        <th>Amount</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="ledger-body">
                    <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 18px;">No transactions recorded.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const assetDefaultPrices = {
            'AAPL': 150.00,
            'GOOGL': 140.00,
            'TSLA': 210.00,
            'BTC': 65000.00,
            'ETH': 3500.00
        };

        let currentAssets = [];

        async function init() {
            await loadAssets();
            await loadUserData();

            document.getElementById('trade-qty').addEventListener('input', calculateTotal);
            document.getElementById('trade-price').addEventListener('input', calculateTotal);
        }

        async function loadAssets() {
            try {
                const res = await fetch('/api/assets');
                const data = await res.json();
                if (data.success) {
                    currentAssets = data.assets;
                    const select = document.getElementById('asset-select');
                    select.innerHTML = data.assets.map(a => 
                        `<option value="${a.id}" data-ticker="${a.ticker_symbol}">${a.ticker_symbol} - ${a.name}</option>`
                    ).join('');
                    updateDefaultPrice();
                }
            } catch (err) {
                showAlert('Failed to load assets: ' + err.message, true);
            }
        }

        function updateDefaultPrice() {
            const select = document.getElementById('asset-select');
            const selectedOption = select.options[select.selectedIndex];
            if (!selectedOption) return;
            const ticker = selectedOption.getAttribute('data-ticker');
            const defaultPrice = assetDefaultPrices[ticker] || 100.00;
            document.getElementById('trade-price').value = defaultPrice.toFixed(2);
            calculateTotal();
        }

        function calculateTotal() {
            const qty = parseFloat(document.getElementById('trade-qty').value) || 0;
            const price = parseFloat(document.getElementById('trade-price').value) || 0;
            const total = qty * price;
            document.getElementById('trade-total').innerText = '$' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function loadUserData() {
            const userId = document.getElementById('user-select').value;
            try {
                const res = await fetch(`/api/user/${userId}`);
                const data = await res.json();

                if (!data.success) {
                    showAlert(data.error, true);
                    return;
                }

                const numBal = parseFloat(data.balance);
                document.getElementById('wallet-balance').innerText = '$' + numBal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                document.getElementById('user-info').innerText = `${data.user.email} · User #${data.user.id}`;

                const holdingsBody = document.getElementById('holdings-body');
                if (data.holdings.length === 0) {
                    holdingsBody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 18px;">No asset holdings.</td></tr>';
                } else {
                    holdingsBody.innerHTML = data.holdings.map(h => `
                        <tr>
                            <td><strong>${h.ticker_symbol}</strong></td>
                            <td>${h.name}</td>
                            <td>${parseFloat(h.quantity).toFixed(4)}</td>
                        </tr>
                    `).join('');
                }

                const ledgerBody = document.getElementById('ledger-body');
                if (data.ledger.length === 0) {
                    ledgerBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 18px;">No transactions recorded.</td></tr>';
                } else {
                    ledgerBody.innerHTML = data.ledger.map(tx => {
                        const isCredit = parseFloat(tx.amount) >= 0;
                        const badgeClass = tx.transaction_type === 'DEPOSIT' ? 'badge-deposit' : (tx.transaction_type === 'BUY' ? 'badge-buy' : 'badge-sell');
                        return `
                            <tr>
                                <td>#${tx.id}</td>
                                <td><span class="badge ${badgeClass}">${tx.transaction_type}</span></td>
                                <td>${tx.ticker_symbol || 'CASH'}</td>
                                <td class="${isCredit ? 'amount-positive' : 'amount-negative'}">
                                    ${isCredit ? '+' : ''}$${parseFloat(tx.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                </td>
                                <td style="color: var(--text-muted); font-size: 12px;">${new Date(tx.created_at).toLocaleString()}</td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (err) {
                showAlert('Error loading user data: ' + err.message, true);
            }
        }

        async function handleDeposit() {
            const userId = document.getElementById('user-select').value;
            const amount = parseFloat(document.getElementById('deposit-amount').value);

            if (!amount || amount <= 0) {
                showAlert('Please enter a valid deposit amount.', true);
                return;
            }

            try {
                const res = await fetch('/api/deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, amount })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert(data.message, false);
                    document.getElementById('deposit-amount').value = '';
                    loadUserData();
                } else {
                    showAlert(data.error, true);
                }
            } catch (err) {
                showAlert('Deposit error: ' + err.message, true);
            }
        }

        async function handleTrade(action) {
            const userId = document.getElementById('user-select').value;
            const assetId = document.getElementById('asset-select').value;
            const quantity = parseFloat(document.getElementById('trade-qty').value);
            const pricePerUnit = parseFloat(document.getElementById('trade-price').value);

            if (!quantity || quantity <= 0 || !pricePerUnit || pricePerUnit <= 0) {
                showAlert('Please provide valid quantity and price.', true);
                return;
            }

            try {
                const res = await fetch(`/api/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, assetId, quantity, pricePerUnit })
                });
                const data = await res.json();
                if (data.success) {
                    showAlert(data.message, false);
                    loadUserData();
                } else {
                    showAlert(data.error, true);
                }
            } catch (err) {
                showAlert(`${action.toUpperCase()} trade error: ` + err.message, true);
            }
        }

        function showAlert(msg, isError) {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = isError ? 'alert-error' : 'alert-success';
            alertBox.innerText = msg;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        window.onload = init;
    </script>
</body>
</html>
